name: Build ls_dbagent (server)

on:
  push:
    branches: [ feat/odbc-dbagent ]
  workflow_dispatch:

env:
  CFG: ${{ inputs.configuration || 'Release' }}
  PLT: ${{ inputs.platform || 'Win32' }}

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show target config
        shell: cmd
        run: echo CFG=%CFG% PLT=%PLT%

      - name: Build dependency INI (ioINILoader)
        shell: cmd
        run: msbuild win\ioINILoader.sln /p:Configuration=%CFG% /p:Platform=%PLT% /p:PlatformToolset=v143 /m /v:minimal

      - name: Build dependency iocpSocketDLL
        shell: cmd
        run: msbuild win\iocpSocketDLL.sln /p:Configuration=%CFG% /p:Platform=%PLT% /p:PlatformToolset=v143 /m /v:minimal

      - name: Build dependency Log
        shell: cmd
        run: msbuild win\Log.sln /p:Configuration=%CFG% /p:Platform=%PLT% /p:PlatformToolset=v143 /m /v:minimal

      - name: Build ls_dbagent
        shell: cmd
        run: msbuild win\ls_dbagent.sln /p:Configuration=%CFG% /p:Platform=%PLT% /p:PlatformToolset=v143 /m /v:minimal

      - name: Locate artifact
        shell: pwsh
        run: Get-ChildItem -Recurse -Filter ls_dbagent.exe | Select-Object FullName, Length | Format-Table

      - name: Copy artifact into workspace
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item -Recurse -Force 'D:\a\Legacy\build\Server\ls_dbagent\*' out\ -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse out | Select-Object FullName, Length | Format-Table

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ls_dbagent-${{ env.CFG }}-${{ env.PLT }}
          path: 'out/**/ls_dbagent.exe'
          if-no-files-found: error
